<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>EST 视觉现场验收</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; font: 16px 'Segoe UI', 'Microsoft YaHei', sans-serif; color: #202831; background: #f3f5f7; }
h1 { font-size: 24px; margin: 0 0 12px; }
#stage { padding: 12px 0; font-size: 22px; color: #12684a; min-height: 62px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; }
.preview { position: relative; aspect-ratio: 4 / 3; background: #121820; overflow: hidden; }
video, canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); object-fit: contain; }
canvas { pointer-events: none; }
button { padding: 12px 18px; border: 0; border-radius: 6px; background: #117849; color: white; font: inherit; cursor: pointer; }
button:disabled { opacity: .5; }
#results { white-space: pre-wrap; line-height: 1.7; }
@media(max-width:700px) { main { grid-template-columns: 1fr; } }
</style></head><body>
<h1>EST 视觉现场验收</h1>
<div id="stage">正在准备模型，请稍候…</div>
<main><div class="preview"><video id="video" muted playsinline></video><canvas id="overlay"></canvas></div>
<aside><button id="begin" disabled>开始四项测试</button><p id="live"></p><button id="removed" disabled>双手已离开画面</button><div id="results"></div></aside></main>
</body></html>
